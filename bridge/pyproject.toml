[project]
name = "dt-bridge"
version = "0.1.0"
description = "Real-time bridge between ExaDigiT Simulation Server and OpenDCIM (PDU stats)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "requests>=2.31",
]

[project.scripts]
dt-bridge = "app.api:run"

[tool.uvicorn]
factory = false